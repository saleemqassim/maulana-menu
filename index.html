<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maulana Restaurant — Speisekarte</title>
<meta http-equiv="refresh" content="0;url=speisekarte.pdf">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #0a1d0d;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}
.box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
  padding: 2.5rem 2rem;
}
.logo-text {
  font-size: 1.3rem;
  letter-spacing: 0.5em;
  color: #e8c56a;
  text-transform: uppercase;
}
.sub {
  font-size: 0.75rem;
  letter-spacing: 0.35em;
  color: #c9a84c;
}
.btn {
  display: inline-block;
  background: rgba(201,168,76,0.15);
  border: 1.5px solid #c9a84c;
  border-radius: 6px;
  padding: 0.75rem 2rem;
  font-size: 1rem;
  font-weight: 700;
  color: #e8c56a;
  text-decoration: none;
  letter-spacing: 0.08em;
}
.hint {
  font-size: 0.7rem;
  color: rgba(201,168,76,0.45);
  letter-spacing: 0.1em;
}
</style>
</head>
<body>
<div class="box">
  <div class="logo-text">MAULANA</div>
  <div class="sub">R E S T A U R A N T</div>
  <a class="btn" href="speisekarte.pdf">Speisekarte öffnen (PDF)</a>
  <div class="hint">Wird automatisch geladen…</div>
</div>
<script>
  window.location.replace('speisekarte.pdf');
</script>
</body>
</html>
